[package]
name = "token-proxy"
version = "0.1.0"
edition = "2024"
description = "Local proxy that adds API tokens to requests, so AI agents can call services without ever seeing a token"
license = "MIT"
repository = "https://github.com/mpenchenat93/token-proxy"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
block2 = "0.6.2"
chrono = "0.4.45"
futures-util = "0.3.34"
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-local-authentication = "0.3.2"
parking_lot = "0.13.0"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "http2"] }
rust-embed = { version = "8.13.0", features = ["mime-guess"] }
security-framework = "3.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde_json = "1.0.154"
tower = { version = "0.5.3", features = ["util"] }
wiremock = "0.6.5"
